<!DOCTYPE html>
<html>
    <head>
        <!-- Essential stuff -->
        <meta charset="UTF-8">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js" type="text/javascript"></script>

        <!-- Fonts -->
        <link rel="stylesheet" href="fonts/terminus.css">
        <link rel="stylesheet" href="fonts/minecraftia.css">

        <!-- Main CSS: DO NOT REMOVE -->
        <link rel="stylesheet" href="css/theme.css">
        <link rel="stylesheet" href="css/uielements.css">

        <!-- Here is where you insert the stylesheets for your windows -->
        <link rel="stylesheet" href="css/profileWindow.css">
        <link rel="stylesheet" href="css/settingsWindow.css">

        <title>The World Machine</title>
        <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

        <!-- SVGInject - vital -->
        <script src="deps/svg-inject.min.js"></script>

        <!-- Twemoji library -->
        <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script> 
    </head>
    <body>

        <noscript>Enable JS pwease</noscript>

        <div id="desktop">
            <div class="hoverable desktop-icon" loads-app="profileWindow" focus-if-loaded="profile-window">
                <img src="svg/apps/profile_app_icon.svg" onload="SVGInject(this)" class="desktop-icon-icon" draggable="false">
                <span class="desktop-icon-name">Profile</span>
            </div>
            <div class="hoverable desktop-icon" loads-app="settingsWindow" focus-if-loaded="settings-window">
                <img src="svg/apps/settings_app_icon.svg" onload="SVGInject(this)" class="desktop-icon-icon" draggable="false">
                <span class="desktop-icon-name">Settings</span>
            </div>
<!--             <div class="hoverable desktop-icon" loads-app="musicBoxWindow" focus-if-loaded="musicbox-window">
                <img src="svg/apps/musicbox_app_icon.svg" onload="SVGInject(this)" class="desktop-icon-icon" draggable="false">
                <span class="desktop-icon-name">Music Box</span>
            </div> -->
        </div>

        <div id="taskbar">
            <div id="taskbar-icons">

            </div>
            
            <span id="taskbar-clock">11:59 PM</span>

            <img src="svg/ui/taskbar_hide.svg" onload="SVGInject(this)" class="hoverable" id="taskbar-hide-button" draggable="false">
            <img src="svg/ui/taskbar_unhide.svg" onload="SVGInject(this)" class="hoverable" id="taskbar-unhide-button" draggable="false">
        </div>

        <script src="js/windowLogic.js"></script>
        <script src="js/windowElements.js"></script>

        <script src="js/firstRun.js"></script>

        <script src="js/clock.js"></script>
        
        <img id="cursor" src="svg/cursors/normal.svg">
        
    </body>
</html>
