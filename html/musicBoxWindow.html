<div class="window musicbox-window" window-titlebar-name="Music Box" window-titlebar-icon="apps/musicbox_app_icon" has-maximize-button="false">
    <div class="window-content">
        
        <twm-scroll class="musicbox-name" getValue="this.text = 'Please wait...'">Current Track:</twm-scroll>
        <twm-slider class="musicbox-progressbar" min="0" max="180" step="1" button-step="10" default="0" onmodify="musicSliderModify(this)">0:00 / 0:00</twm-slider>
        <div class="musicbox-options">
            <twm-slider min="25" max="200" step="25" default="100" onmodify="setPlaybackSpeed(this)">Playback Speed: $1%</twm-slider>
            <twm-slider min="0" max="100" step="1" default="100" onmodify="setPlaybackVolume(this)">Playback Volume: $1%</twm-slider>
        </div>
        <div class="musicbox-button">
            <img src="svg/apps/musicbox/play_button.svg" onload="SVGInject(this)" class="musicbox-playbutton" draggable="false">
            <img src="svg/apps/musicbox/pause_button.svg" onload="SVGInject(this)" class="musicbox-pausebutton" draggable="false">
        </div>
    </div>
    <script src="./js/musicWindow.js"></script>
    
    <div id="ytplayer"></div>
</div>
