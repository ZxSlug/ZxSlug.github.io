<div class="window-titlebar grabbable">
    <div class="window-title">
        <img src="svg/ui/placeholder.svg" onload="SVGInject(this)" class="window-icon" draggable="false">
        <span class="window-header-text"></span>
    </div>
    <div class="window-controls">
        <img src="svg/ui/minimize_button.svg" onload="SVGInject(this)" class="hoverable window-control window-minimize-button" draggable="false">
        <img src="svg/ui/maximize_button.svg" onload="SVGInject(this)" class="hoverable window-control window-maximize-button" draggable="false">
        <img src="svg/ui/exit_button.svg" onload="SVGInject(this)" class="hoverable window-control window-exit-button" draggable="false">
    </div>
</div>
