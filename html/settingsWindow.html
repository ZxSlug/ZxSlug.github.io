<div class="window settings-window" window-titlebar-name="Settings" window-titlebar-icon="apps/settings_app_icon" has-maximize-button="false">
    <div class="window-content settings-content">
        <twm-scroll choices="colorArray" getValue="getTheme();" testinput="checkColor(this);" onmodify="applyColor(this);">Theme:</twm-scroll>
        <twm-slider min="0" max="100" step="1" getvalue="getVolume();" onmodify="changeVolume(this);">Page Volume: $1%</twm-slider>
        <div class="settings-element">
            <span class="settings-element-label">ADVANCED USERS ONLY</span>
            <span class="hoverable settings-button" onclick="resetLocalStorage()">Reset LocalStorage</span>
            <span class="hoverable settings-button" onclick="enableRGB()"><span style="color: red">R</span><span style="color: green">G</span><span style="color: blue">B</span> Mode</span>
        </div>
    </div>
    <script src="./js/settingsWindow.js"></script>
</div>
